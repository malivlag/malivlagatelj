<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – Stran ne obstaja · Mali Vlagatelj</title>
<meta name="description" content="Iskana stran ne obstaja. Vrnite se na prvo stran glasila Mali Vlagatelj.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230d5c52' stroke='%235eead4' stroke-width='3'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0d5c52">

<style>
  :root {
    --bg: #fbf9f5;
    --surface: #ffffff;
    --ink: #111827;
    --ink-light: #374151;
    --muted: #57534e;
    --line: #e7e5e0;
    --line-subtle: #f1efe9;
    --accent: #0d5c52;
    --accent-hover: #083e37;
    --accent-tint: #edf7f5;
    --accent-border: #c4e4dd;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-card: 0 12px 30px -4px rgba(13, 92, 82, 0.08), 0 4px 10px -2px rgba(0, 0, 0, 0.03);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.65;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  a:hover { color: var(--accent-hover); }
  a:focus-visible, button:focus-visible {
    outline: 3px solid #f59e0b;
    outline-offset: 3px;
    border-radius: 4px;
  }

  .wrap {
    max-width: 740px;
    margin: 0 auto;
    padding: 0 24px;
    width: 100%;
  }

  header.top {
    padding: 24px 0;
    border-bottom: 1px solid var(--line-subtle);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 21px;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-decoration: none;
  }
  .brand-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: inset 0 0 0 4px #5eead4;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 60px 0;
  }

  .error-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 44px 32px;
    text-align: center;
    box-shadow: var(--shadow-card);
  }
  .error-code {
    display: inline-block;
    background: var(--accent-tint);
    color: var(--accent);
    font-weight: 800;
    font-size: 15px;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 16px;
    border: 1px solid var(--accent-border);
  }
  h1 {
    font-size: clamp(28px, 5vw, 38px);
    line-height: 1.2;
    margin: 0 0 14px;
    font-weight: 800;
  }
  p {
    color: var(--muted);
    font-size: 18px;
    margin: 0 0 28px;
  }

  .button {
    display: inline-block;
    background: var(--accent);
    color: #ffffff !important;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 28px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(13, 92, 82, 0.25);
    transition: all 0.2s ease;
  }
  .button:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 30px 0;
    font-size: 15px;
    color: var(--muted);
    background: #f7f5f0;
  }
  .footer-meta { margin: 0; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-icon" aria-hidden="true"></span>
      Mali Vlagatelj
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="error-card">
      <span class="error-code">Napaka 404</span>
      <h1>Stran ne obstaja</h1>
      <p>Povezava, ki ste jo odprli, morda ne deluje več ali pa je bil spletni naslov napačno vpisan.</p>
      <a class="button" href="/">Nazaj na prvo stran</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="footer-meta">Mali Vlagatelj · <a href="mailto:info@malivlagatelj.si">info@malivlagatelj.si</a> · <a href="/zasebnost.html">Politika zasebnosti</a></p>
  </div>
</footer>

</body>
</html>
